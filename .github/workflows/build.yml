# Builds the Windows installer on every push and pull request, after the allow tests pass, and keeps it as a workflow
# artifact. The installer is unsigned for now. It never publishes a release.
name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    # Each action is pinned to a commit, since a tag can be moved to other code. To update one, pin the commit its new
    # tag points to.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guild-golem-installer
          path: release/Guild-Golem-Setup-*.exe
          if-no-files-found: error
